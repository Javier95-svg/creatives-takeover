name: Deploy changed Supabase functions

# Edge Functions must not depend on the entire application test suite passing.
# The frontend can call a new function as soon as Vercel deploys, so leaving the
# function behind turns an otherwise valid release into a production 404.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions-deploy.yml'

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Deploy changed edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -o pipefail

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- supabase/functions/ || true)"
          if [ -z "$changed_files" ]; then
            echo "No edge function changes in this push." | tee supabase-function-deploy.log
            exit 0
          fi

          echo "Changed under supabase/functions/:"
          echo "$changed_files"
          targets=""

          for f in $changed_files; do
            name="$(echo "$f" | awk -F/ '{print $3}')"
            case "$name" in
              _*|"") continue ;;
            esac
            targets="$targets $name"
          done

          # Shared modules are bundled into every importer at deployment time.
          shared_changed="$(echo "$changed_files" | grep '^supabase/functions/_shared/' || true)"
          for shared in $shared_changed; do
            base="$(basename "$shared")"
            while IFS= read -r importer; do
              name="$(echo "$importer" | awk -F/ '{print $3}')"
              case "$name" in
                _*|"") continue ;;
              esac
              targets="$targets $name"
            done <<< "$(grep -rl "_shared/$base" supabase/functions --include='index.ts' || true)"
          done

          targets="$(echo "$targets" | tr ' ' '\n' | sed '/^$/d' | sort -u)"
          if [ -z "$targets" ]; then
            echo "Nothing deployable resolved." | tee supabase-function-deploy.log
            exit 0
          fi

          echo "Deploying:"
          echo "$targets"
          for name in $targets; do
            if [ ! -f "supabase/functions/$name/index.ts" ]; then
              echo "Skipping $name (no index.ts; likely deleted)"
              continue
            fi

            flags=""
            if awk -v fn="$name" '
                 $0 == "[functions." fn "]" { inblock = 1; next }
                 /^\[/ { inblock = 0 }
                 inblock && /verify_jwt[[:space:]]*=[[:space:]]*false/ { found = 1 }
                 END { exit !found }
               ' supabase/config.toml; then
              flags="--no-verify-jwt"
            fi

            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" $flags
          done 2>&1 | tee supabase-function-deploy.log

      - name: Upload sanitized deployment log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-${{ github.sha }}
          path: supabase-function-deploy.log
          retention-days: 14
