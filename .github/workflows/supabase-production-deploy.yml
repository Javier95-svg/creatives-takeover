name: Deploy Supabase production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The parent commit is needed to work out which edge functions changed.
          fetch-depth: 2

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-link.log

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-migration-dry-run.log

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-migration-apply.log

      # Previously this deployed one hardcoded function (pmf-customer-discovery),
      # so every other function was undeployed by default until someone
      # remembered. The July 2026 audit found three functions the frontend was
      # calling that returned 404 in production as a result. Now the changed set
      # is derived from the commit.
      - name: Deploy changed edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -o pipefail

          changed_files="$(git diff --name-only HEAD~1 HEAD -- supabase/functions/ || true)"
          if [ -z "$changed_files" ]; then
            echo "No edge function changes in this commit." | tee supabase-function-deploy.log
            exit 0
          fi
          echo "Changed under supabase/functions/:"; echo "$changed_files"

          targets=""

          # Directly edited functions.
          for f in $changed_files; do
            name="$(echo "$f" | awk -F/ '{print $3}')"
            case "$name" in
              _*|"") continue ;;
            esac
            targets="$targets $name"
          done

          # A change under _shared/ affects every function that imports it, and
          # those keep running the old bundled copy until redeployed.
          shared_changed="$(echo "$changed_files" | grep '^supabase/functions/_shared/' || true)"
          for shared in $shared_changed; do
            base="$(basename "$shared")"
            echo "Shared module changed: $base — finding importers"
            while IFS= read -r importer; do
              name="$(echo "$importer" | awk -F/ '{print $3}')"
              case "$name" in
                _*|"") continue ;;
              esac
              targets="$targets $name"
            done <<< "$(grep -rl "_shared/$base" supabase/functions --include='index.ts' || true)"
          done

          targets="$(echo "$targets" | tr ' ' '\n' | sed '/^$/d' | sort -u)"
          if [ -z "$targets" ]; then
            echo "Nothing deployable resolved." | tee supabase-function-deploy.log
            exit 0
          fi

          echo "Deploying:"; echo "$targets"
          for name in $targets; do
            if [ ! -f "supabase/functions/$name/index.ts" ]; then
              echo "Skipping $name (no index.ts — likely deleted)"
              continue
            fi
            # config.toml is the source of truth for verify_jwt; pass the flag
            # explicitly so a public function is not silently re-gated on deploy.
            flags=""
            if awk -v fn="$name" '
                 $0 == "[functions." fn "]" { inblock = 1; next }
                 /^\[/ { inblock = 0 }
                 inblock && /verify_jwt[[:space:]]*=[[:space:]]*false/ { found = 1 }
                 END { exit !found }
               ' supabase/config.toml; then
              flags="--no-verify-jwt"
              echo "$name: verify_jwt=false in config.toml, deploying with --no-verify-jwt"
            fi
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" $flags
          done 2>&1 | tee supabase-function-deploy.log

      - name: Upload sanitized deployment logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-${{ github.event.workflow_run.head_sha }}
          path: supabase-*.log
          retention-days: 14

