name: Release reviewed Supabase migrations

on:
  workflow_dispatch:
    inputs:
      schema_backup_reference:
        description: Verified production backup or PITR reference created before this release
        required: true
        type: string
      ledger_reconciliation_record:
        description: Link or change record proving live schema and migration-ledger reconciliation
        required: true
        type: string
      reviewed_migrations:
        description: Comma-separated migration timestamps or full migration names approved for this release
        required: true
        type: string
      apply_reviewed_migrations:
        description: Apply after ledger checks and dry-run; false performs a rehearsal only
        required: true
        default: false
        type: boolean

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate manual release attestations
        env:
          BACKUP_REFERENCE: ${{ inputs.schema_backup_reference }}
          LEDGER_RECORD: ${{ inputs.ledger_reconciliation_record }}
        run: |
          test -n "$BACKUP_REFERENCE"
          test -n "$LEDGER_RECORD"
          test "${#BACKUP_REFERENCE}" -ge 8
          test "${#LEDGER_RECORD}" -ge 8

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Link production and capture the live ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-link.log
          supabase migration list --linked 2>&1 | tee supabase-migration-ledger-before.log

      - name: Capture pre-release public schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db dump --linked --schema public --file production-public-schema-before.sql

      - name: Dry-run the migration set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-migration-dry-run.log

      - name: Reject unreviewed pending migrations
        env:
          REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations }}
        run: node scripts/verify-pilot-release.mjs supabase-migration-dry-run.log | tee supabase-reviewed-migrations.log

      - name: Lint the linked public schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db lint --linked --schema public --level error 2>&1 | tee supabase-db-lint.log

      - name: Apply only the reviewed dry-run
        if: ${{ inputs.apply_reviewed_migrations }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee supabase-migration-apply.log
          supabase migration list --linked 2>&1 | tee supabase-migration-ledger-after.log

      - name: Verify pilot schema, RPCs, RLS, storage, and public proof-loop triggers
        if: ${{ inputs.apply_reviewed_migrations }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          curl --silent --show-error --fail --request POST "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/get_outcome_journey_release_health_v1" --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" --header "Content-Type: application/json" --data '{}' | tee supabase-pilot-health.log
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('supabase-pilot-health.log','utf8'));if(!x.healthy)process.exit(1)"

      - name: Verify live market providers with a controlled query
        if: ${{ inputs.apply_reviewed_migrations }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          curl --silent --show-error --fail --request POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-provider-health" --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" --header "Content-Type: application/json" --data '{}' | tee supabase-provider-health.log

      # Edge Functions deploy through supabase-functions-deploy.yml so they remain
      # independent of schema-release failures and cannot be deployed twice here.
      - name: Deploy changed edge functions
        if: ${{ false }}
        run: echo "Handled by the independent Supabase functions workflow."

      - name: Record deployment health
        if: ${{ always() }}
        env:
          BACKUP_REFERENCE: ${{ inputs.schema_backup_reference }}
          LEDGER_RECORD: ${{ inputs.ledger_reconciliation_record }}
          REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations }}
          APPLIED: ${{ inputs.apply_reviewed_migrations }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          jq -n --arg sha "$RELEASE_SHA" --arg backup "$BACKUP_REFERENCE" --arg ledger "$LEDGER_RECORD" --arg migrations "$REVIEWED_MIGRATIONS" --arg applied "$APPLIED" --arg completedAt "$(date -u +%FT%TZ)" '{sha:$sha,backupReference:$backup,ledgerReconciliationRecord:$ledger,reviewedMigrations:$migrations,applied:($applied=="true"),completedAt:$completedAt,pilotFlagsEnabled:false}' > supabase-release-health.json

      - name: Upload sanitized release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-${{ github.sha }}
          path: |
            supabase-*.log
            supabase-release-health.json
            production-public-schema-before.sql
          retention-days: 30
