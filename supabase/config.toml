# ─── Recorded 2026-07-25 (delivery audit, Phase 4) ────────────────────────────
# These were already deployed with verify_jwt = false but were never declared
# here, so config.toml disagreed with production. That was harmless only while
# deploys were manual and one-at-a-time; once CI deploys the changed set, an
# undeclared function would be redeployed JWT-gated and would break silently.
# Each was confirmed against production: an anonymous POST reaches the function
# (200/400/422/500) instead of being rejected with 401.

